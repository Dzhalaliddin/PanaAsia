<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оцените ваш отдых</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --pana-coral: #e2543f;
    --pana-coral-soft: #f07a66;
    --pana-cream: #fdf3ef;
    --text-dark: #1a1a1a;
    --text-mid: #5a5a5a;
    --text-light: #9a9a9a;
    --border: #ececec;
    --surface: #ffffff;
    --surface-soft: #fafafa;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    /* Фон в фирменных цветах PANA: коралловый с мягким переходом */
    background: linear-gradient(160deg, #f07a66 0%, #e2543f 45%, #c8402d 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* Лёгкое световое пятно сверху */
  body::before {
    content: '';
    position: fixed;
    top: -25%;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    color: var(--text-dark);
    border-radius: 26px;
    padding: 34px 32px 30px;
    max-width: 500px;
    width: 100%;
    box-shadow:
      0 30px 80px rgba(140, 40, 25, 0.35),
      0 0 0 1px rgba(255,255,255,0.4);
    animation: cardIn .7s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .header { text-align: center; margin-bottom: 22px; }

  /* Логотип pana */
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(160deg, var(--pana-coral-soft), var(--pana-coral));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(226,84,63,0.35);
    flex-shrink: 0;
  }

  .logo-mark svg { width: 24px; height: 24px; }

  .logo-text {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text-dark);
    font-family: 'Inter', sans-serif;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text-dark);
    margin-bottom: 6px;
  }

  .header p {
    font-size: 14px;
    color: var(--text-mid);
    line-height: 1.5;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 22px 0;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 14px;
    text-align: center;
  }

  .hotel-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 24px;
  }

  .hotel-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    cursor: pointer;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dark);
    text-align: left;
    width: 100%;
    overflow: hidden;
  }

  .hotel-item:hover {
    border-color: var(--pana-coral);
    background: var(--pana-cream);
    transform: translateX(3px);
  }

  .hotel-item .check {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: transparent;
    transition: all .25s;
  }

  .hotel-item.selected {
    border-color: var(--pana-coral);
    background: var(--pana-cream);
    box-shadow: 0 8px 24px rgba(226,84,63,0.18);
    transform: translateX(0);
  }

  .hotel-item.selected .check {
    background: var(--pana-coral);
    border-color: var(--pana-coral);
    color: #fff;
  }

  .rating-block {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity .4s ease, max-height .5s ease;
  }

  .rating-block.enabled {
    opacity: 1;
    max-height: 500px;
    pointer-events: auto;
  }

  .rating-inner { padding-top: 4px; }

  .stars {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 6px 0 10px;
    user-select: none;
  }

  .star {
    font-size: 42px;
    line-height: 1;
    cursor: pointer;
    color: #e6e6e6;
    background: none;
    border: none;
    padding: 4px;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), color .2s;
  }

  .star:hover { transform: scale(1.18) translateY(-2px); }

  .star.active {
    color: #f5b800;
    filter: drop-shadow(0 4px 8px rgba(245,184,0,0.35));
  }

  .hint {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-light);
    min-height: 20px;
    margin-bottom: 20px;
    transition: color .2s;
  }

  .hint.filled { color: var(--pana-coral); font-weight: 600; }

  .btn {
    width: 100%;
    padding: 16px;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: .3px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--pana-coral-soft), var(--pana-coral));
    color: #fff;
    cursor: pointer;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 8px 20px rgba(226,84,63,0.35);
  }

  .btn:not(:disabled):hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(226,84,63,0.5);
    background: linear-gradient(135deg, var(--pana-coral), #c8402d);
  }

  .btn:disabled {
    opacity: .4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .note {
    text-align: center;
    font-size: 12px;
    color: var(--text-light);
    margin-top: 18px;
    line-height: 1.55;
  }

  @media (max-width: 480px) {
    .card { padding: 28px 22px 24px; border-radius: 22px; }
    .header h1 { font-size: 23px; }
    .logo-text { font-size: 23px; }
    .logo-mark { width: 36px; height: 36px; border-radius: 10px; }
    .star { font-size: 38px; }
    .hotel-item { padding: 14px 15px; font-size: 14.5px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10.5L12 4L20 10.5V19C20 19.55 19.55 20 19 20H15V14H9V20H5C4.45 20 4 19.55 4 19V10.5Z" fill="#ffffff"/>
        </svg>
      </span>
      <span class="logo-text">pana</span>
    </div>
    <h1>Оцените ваш отдых</h1>
    <p>Выберите отель и поставьте оценку</p>
  </div>

  <div class="divider"></div>

  <p class="section-label">Выберите отель</p>

  <div class="hotel-list" id="hotelList">
    <button class="hotel-item" data-key="kainar">
      <span>Kainar Hotel</span>
      <span class="check">✓</span>
    </button>
    <button class="hotel-item" data-key="ayusai">
      <span>Pana Ayusai</span>
      <span class="check">✓</span>
    </button>
    <button class="hotel-item" data-key="nomad_kolsay">
      <span>Nomad Kolsay</span>
      <span class="check">✓</span>
    </button>
    <button class="hotel-item" data-key="unique_charyn">
      <span>Pana Unique Charyn</span>
      <span class="check">✓</span>
    </button>
    <button class="hotel-item" data-key="unique_semey">
      <span>Pana Unique Semey</span>
      <span class="check">✓</span>
    </button>
    <button class="hotel-item" data-key="unique_kolsay">
      <span>Pana Unique Kolsay</span>
      <span class="check">✓</span>
    </button>
  </div>

  <div class="rating-block" id="ratingBlock">
    <div class="rating-inner">
      <p class="section-label">Ваша оценка</p>
      <div class="stars" id="stars">
        <button class="star" data-value="1">★</button>
        <button class="star" data-value="2">★</button>
        <button class="star" data-value="3">★</button>
        <button class="star" data-value="4">★</button>
        <button class="star" data-value="5">★</button>
      </div>
      <p class="hint" id="hint">Нажмите на звезду</p>

      <button class="btn" id="submit" disabled>Отправить</button>
    </div>
  </div>

  <p class="note">Спасибо, что помогаете нам стать лучше</p>
</div>

<script>
  const GIS_LINKS = {
    kainar:        "https://2gis.kz/shymkent/firm/70000001026514225/tab/reviews/addreview?m=69.630192%2C42.386431%2F18.52",
    ayusai:        "https://2gis.kz/almaty/firm/70000001095525547/tab/reviews/addreview",
    nomad_kolsay:  "https://2gis.kz/almaty/firm/70000001095525626/tab/reviews/addreview",
    unique_charyn: "https://2gis.kz/almaty/firm/70000001114038277/tab/reviews/addreview",
    unique_semey:  "https://2gis.kz/semej/firm/70000001106039532/tab/reviews/addreview",
    unique_kolsay: "https://2gis.kz/almaty/firm/70000001114248247/tab/reviews/addreview"
  };

  const HOTEL_NAMES = {
    kainar:        "Kainar Hotel",
    ayusai:        "Pana Ayusai",
    nomad_kolsay:  "Nomad Kolsay",
    unique_charyn: "Pana Unique Charyn",
    unique_semey:  "Pana Unique Semey",
    unique_kolsay: "Pana Unique Kolsay"
  };

  const WHATSAPP_NUMBER = "77018615121";

  const hotelItems = document.querySelectorAll(".hotel-item");
  const ratingBlock = document.getElementById("ratingBlock");
  const stars = document.querySelectorAll(".star");
  const hint = document.getElementById("hint");
  const submitBtn = document.getElementById("submit");

  let selectedHotel = null;
  let rating = 0;

  hotelItems.forEach(item => {
    item.addEventListener("click", () => {
      hotelItems.forEach(i => i.classList.remove("selected"));
      item.classList.add("selected");
      selectedHotel = item.dataset.key;
      ratingBlock.classList.add("enabled");
      checkReady();
    });
  });

  stars.forEach(star => {
    star.addEventListener("click", () => {
      rating = parseInt(star.dataset.value, 10);
      updateStars(rating);
      hint.textContent = `Вы поставили ${rating} ${plural(rating)}`;
      hint.classList.add("filled");
      checkReady();
    });
    star.addEventListener("mouseenter", () => updateStars(parseInt(star.dataset.value, 10)));
  });

  document.getElementById("stars").addEventListener("mouseleave", () => updateStars(rating));

  function updateStars(value) {
    stars.forEach(s => {
      s.classList.toggle("active", parseInt(s.dataset.value, 10) <= value);
    });
  }

  function plural(n) {
    if (n === 1) return "звезду";
    if (n >= 2 && n <= 4) return "звезды";
    return "звёзд";
  }

  function checkReady() {
    submitBtn.disabled = !(selectedHotel && rating > 0);
  }

  submitBtn.addEventListener("click", () => {
    if (!selectedHotel || !rating) return;
    const hotelName = HOTEL_NAMES[selectedHotel];

    if (rating <= 3) {
      const text = `Здравствуйте! Я гость отеля ${hotelName}. Моя оценка: ${rating} из 5. Хочу оставить отзыв/замечание.`;
      window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
    } else {
      window.location.href = GIS_LINKS[selectedHotel];
    }
  });
</script>

</body>
</html>
